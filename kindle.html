<title>EntropIA — Ranking</title>
<!--
  EntropIA · ranking para Kindle · Cientistas do Caos · Challenge 2026

  Feito para o navegador do Kindle, que é antigo e tem tela de tinta:
  - JavaScript à moda antiga (sem =>, sem let/const, sem fetch);
  - lê o ranking por JSONP (?callback=), que não depende de CORS;
  - preto no branco, sem animação, sem degradê: tinta eletrônica pisca a

html, body { margin: 0; padding: 0; background: #fff; color: #000; }
body { font-family: Georgia, "Times New Roman", serif; font-size: 20px; line-height: 1.3; }
.folha { padding: 18px 22px 14px; }
.topo { width: 100%; border-collapse: collapse; border-bottom: 3px solid #000; margin-bottom: 10px; }
.topo td { vertical-align: middle; padding: 0 0 10px; }
.topo img.logo { width: 150px; display: block; }
.topo .titulo { text-align: right; font-family: Helvetica, Arial, sans-serif; }
.topo .titulo b { display: block; font-size: 30px; letter-spacing: -0.5px; }
.topo .titulo span { font-size: 16px; }
table.lista { width: 100%; border-collapse: collapse; font-family: Helvetica, Arial, sans-serif; }
table.lista th { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; text-align: left;
  border-bottom: 2px solid #000; padding: 4px 6px; }
table.lista th.n, table.lista td.n { text-align: right; }
table.lista td { font-size: 22px; padding: 9px 6px; border-bottom: 1px solid #888; }
table.lista td.pos { width: 1.8em; font-weight: bold; font-size: 24px; }
table.lista td.nome { font-weight: bold; }
table.lista td.ix { font-size: 16px; white-space: nowrap; }
table.lista tr.primeiro td { font-size: 27px; border-bottom: 2px solid #000; }
table.lista tr.primeiro td.pos { font-size: 30px; }
.vazio { font-size: 22px; padding: 40px 6px; text-align: center; }
.base { width: 100%; border-collapse: collapse; margin-top: 14px; border-top: 3px solid #000; }
.base td { vertical-align: top; padding-top: 10px; font-family: Helvetica, Arial, sans-serif; }
.base .qr { width: 140px; }
.base .qr img { width: 130px; height: 130px; display: block; }
.base .texto { font-size: 18px; padding-left: 14px; }
.base .texto b.grande { display: block; font-size: 24px; margin-bottom: 4px; }
.base .texto .url { font-size: 15px; word-wrap: break-word; }
@media (max-height: 880px) {
  .folha { padding: 10px 16px 8px; }
  .topo img.logo { width: 110px; }
  .topo td { padding-bottom: 6px; }
  .topo .titulo b { font-size: 26px; }
  table.lista td { font-size: 19px; padding: 5px 6px; }
  table.lista td.pos { font-size: 20px; }
  table.lista tr.primeiro td { font-size: 23px; }
  table.lista tr.primeiro td.pos { font-size: 25px; }
  table.lista td.ix { font-size: 14px; }
  .base { margin-top: 8px; }
  .base .qr { width: 118px; }
  .base .qr img { width: 110px; height: 110px; }
  .base .texto { font-size: 15px; }
  .base .texto b.grande { font-size: 19px; }
  .status { margin-top: 4px; }
}
.status { font-size: 14px; margin-top: 8px; font-family: Helvetica, Arial, sans-serif; }

<script>
/* =====================================================================
   CONFIGURAÇÃO — pode mexer
   ===================================================================== */
var CONFIG = {
  // A mesma URL do Apps Script do jogo (termina em /exec).
  ENDPOINT: "https://script.google.com/macros/s/AKfycbzmn2ewF0_6yGC0wKSji13GvZ5vu_-Mt3oFyVi-1gpW-SRQ-YE_WljW_Cim1kK-9N6_/exec",
  // Endereço do jogo. Preenchido, o QR leva direto ao jogo; vazio, fica o
  // QR embutido (que aponta para o Google Sites).
  URL_DO_JOGO: "",
  URL_EXIBIDA: "sites.google.com/view/projeto-entropia",
  ATUALIZAR_A_CADA: 60,   // segundos. Menos que isso só faz a tinta piscar.
  ESPERA_MAXIMA: 25       // segundos esperando o servidor antes de desistir
};

/* =====================================================================
   MOTOR
   ===================================================================== */
function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function milhar(n) {
  var s = String(Math.round(n)), saida = "";
  while (s.length > 3) { saida = "." + s.slice(-3) + saida; s = s.slice(0, -3); }
  return s + saida;
}

function hora() {
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}

var ultimoDesenho = "", tentativas = 0, espera = null, script = null;

function desenhar(dados) {
  var lista = (dados && dados.ranking) || [], html = "", i, l;
  if (!lista.length) {
    html = '<tr><td colspan="4" class="vazio">Ninguém no ranking ainda.<br>Seja o primeiro!</td></tr>';
  }
  for (i = 0; i < lista.length; i++) {
    l = lista[i];
    html += '<tr' + (i === 0 ? ' class="primeiro"' : '') + '>' +
      '<td class="pos">' + (i + 1) + '</td>' +
      '<td class="nome">' + esc(l.nome) + '</td>' +
      '<td class="n">' + milhar(l.pontos) + '</td>' +
      '<td class="n ix">' + esc(l.indice) + ' &middot; ' + esc(l.faixa || "") + '</td></tr>';
  }
  var total = dados && dados.total ? dados.total : 0;
  var resumo = milhar(total) + (total === 1 ? " hospital assumido" : " hospitais assumidos") +
    (dados && dados.mediaIndice != null ? " &middot; índice médio " + dados.mediaIndice : "");

  // Só mexe na tela se algo mudou: cada redesenho faz a tinta piscar.
  var assinatura = html + resumo;
  if (assinatura !== ultimoDesenho) {
    $("linhas").innerHTML = html;
    $("resumo").innerHTML = resumo;
    ultimoDesenho = assinatura;
  }
  $("status").innerHTML = "Atualizado às " + hora() + ". Atualiza sozinho a cada " +
    Math.round(CONFIG.ATUALIZAR_A_CADA / 60) + " min.";
}

function falhou(motivo) {
  tentativas++;
  $("status").innerHTML = motivo + " Tentando de novo em " + CONFIG.ATUALIZAR_A_CADA +
    " s" + (ultimoDesenho ? " (mostrando o último ranking que chegou)." : ".");
}

// O Apps Script chama esta função com os dados (JSONP).
window.entropiaRanking = function (dados) {
  clearTimeout(espera);
  tentativas = 0;
  if (dados && dados.ok) desenhar(dados);
  else falhou("O servidor respondeu com erro.");
};

function buscar() {
  if (!CONFIG.ENDPOINT) {
    $("linhas").innerHTML = '<tr><td colspan="4" class="vazio">Falta colar a URL do Apps Script no CONFIG.ENDPOINT.</td></tr>';
    $("resumo").innerHTML = "sem servidor";
    return;
  }
  if (script && script.parentNode) script.parentNode.removeChild(script);
  script = document.createElement("script");
  script.src = CONFIG.ENDPOINT + (CONFIG.ENDPOINT.indexOf("?") >= 0 ? "&" : "?") +
    "callback=entropiaRanking&_=" + new Date().getTime();
  script.onerror = function () { clearTimeout(espera); falhou("Sem internet ou servidor fora do ar."); };
  clearTimeout(espera);
  espera = setTimeout(function () { falhou("O servidor demorou demais."); }, CONFIG.ESPERA_MAXIMA * 1000);
  document.getElementsByTagName("head")[0].appendChild(script);
}

/* QR: desenhado a partir de URL_DO_JOGO, ou o embutido. GIF, que todo
   navegador antigo entende. */
(function () {
  var url = String(CONFIG.URL_DO_JOGO || "").replace(/^\s+|\s+$/g, "");
  if (!url) { $("url").innerHTML = esc(CONFIG.URL_EXIBIDA); return; }
  try {
    var q = qrcode(0, "M"); q.addData(url); q.make();
    var celula = Math.max(2, Math.floor(130 / (q.getModuleCount() + 4)));
    $("qr").src = q.createDataURL(celula, celula * 2);
  } catch (e) { /* fica o embutido */ }
  $("url").innerHTML = esc(url.replace(/^https?:\/\//, "").replace(/\/$/, ""));
})();

buscar();
setInterval(buscar, CONFIG.ATUALIZAR_A_CADA * 1000);
</script>
</body>
</html>
